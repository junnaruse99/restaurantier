# Configuración local de Supabase para Warike POS.
# Referencia: https://supabase.com/docs/guides/local-development/cli/config
# Producción y staging se configuran en el panel de Supabase (región sa-east-1); ver docs/runbook-entornos.md.
project_id = "warike-pos"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
# auto_expose_new_tables queda en su valor por defecto (igual que en la nube): las migraciones
# revocan y conceden los privilegios de anon/authenticated/service_role explícitamente.

[api.tls]
enabled = false

[db]
port = 54322
shadow_port = 54320
health_timeout = "2m"
major_version = 17

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
enabled = true
# Datos del cliente (local, plano, carta, series) y, solo en local, usuarios de desarrollo.
sql_paths = ["./seed/*.sql", "./seed/dev/*.sql"]

[realtime]
enabled = true

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"
openai_api_key = "env(OPENAI_API_KEY)"

[local_smtp]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[storage.s3_protocol]
enabled = false

[storage.analytics]
enabled = false
max_namespaces = 5
max_tables = 10
max_catalogs = 2

[storage.vector]
enabled = false
max_buckets = 10
max_indexes = 5

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["http://localhost:3000"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
# Los usuarios los crea el admin (§4); no hay registro público.
enable_signup = false
enable_anonymous_sign_ins = false
enable_manual_linking = false
minimum_password_length = 12
password_requirements = "lower_upper_letters_digits"

[auth.rate_limit]
email_sent = 2
sms_sent = 30
anonymous_users = 30
token_refresh = 150
sign_in_sign_ups = 30
token_verifications = 30
web3 = 30

[auth.email]
# En la CLI esta opción habilita el proveedor de email (necesario para email + contraseña).
# El registro público sigue cerrado por [auth] enable_signup = false.
enable_signup = true
double_confirm_changes = true
enable_confirmations = false
secure_password_change = true
max_frequency = "1s"
otp_length = 6
otp_expiry = 3600

[auth.sms]
enable_signup = false
enable_confirmations = false
template = "Su código es {{ .Code }}"
max_frequency = "5s"

[auth.sms.twilio]
enabled = false
account_sid = ""
message_service_sid = ""
auth_token = "env(SUPABASE_AUTH_SMS_TWILIO_AUTH_TOKEN)"

# MFA TOTP obligatorio para admin y auditor (§4.1). La obligatoriedad la hace cumplir la base:
# los roles con requiere_mfa solo son efectivos en sesiones aal2.
[auth.mfa]
max_enrolled_factors = 10

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.mfa.phone]
enroll_enabled = false
verify_enabled = false
otp_length = 6
template = "Su código es {{ .Code }}"
max_frequency = "5s"

[auth.web3.solana]
enabled = false

[auth.third_party.firebase]
enabled = false

[auth.third_party.auth0]
enabled = false

[auth.third_party.aws_cognito]
enabled = false

[auth.third_party.clerk]
enabled = false

[auth.oauth_server]
enabled = false
authorization_url_path = "/oauth/consent"
allow_dynamic_registration = false

[edge_runtime]
enabled = true
policy = "per_worker"
inspector_port = 8083
deno_version = 2

# pin-login se llama sin sesión de usuario: valida el token del dispositivo y el PIN por su cuenta.
[functions.pin-login]
verify_jwt = false

[functions.agente-login]
verify_jwt = false

# Comprueba la sesión del admin con la RPC validar_alta_usuario.
[functions.admin-usuarios]
verify_jwt = false

[analytics]
enabled = false
port = 54327
backend = "postgres"

[experimental]
s3_host = "env(S3_HOST)"
s3_region = "env(S3_REGION)"
s3_access_key = "env(S3_ACCESS_KEY)"
s3_secret_key = "env(S3_SECRET_KEY)"
