name: Despliegue (migraciones y Edge Functions)

# Tras un CI verde en main: primero staging; producción espera la aprobación manual configurada en el
# environment "production" de GitHub (Settings → Environments → Required reviewers). §3, §17.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: despliegue
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  staging:
    name: Staging
    # Solo despliega pushes a main de este mismo repositorio. Un PR desde un fork con una rama
    # llamada "main" también dispara workflow_run y no debe recibir los secretos de despliegue.
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 20
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Verificar configuración del entorno
        id: cfg
        run: |
          if [ -z "$SUPABASE_PROJECT_REF" ] || [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::notice::El environment 'staging' aún no está configurado (ver docs/runbook-entornos.md). Se omite el despliegue."
            echo "listo=false" >> "$GITHUB_OUTPUT"
          else
            echo "listo=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.cfg.outputs.listo == 'true'
        uses: pnpm/action-setup@v6
      - if: steps.cfg.outputs.listo == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
      - if: steps.cfg.outputs.listo == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.cfg.outputs.listo == 'true'
        name: Migraciones
        run: |
          pnpm exec supabase link --project-ref "$SUPABASE_PROJECT_REF"
          pnpm exec supabase db push
      - if: steps.cfg.outputs.listo == 'true'
        name: Edge Functions
        run: pnpm exec supabase functions deploy --project-ref "$SUPABASE_PROJECT_REF"

  production:
    name: Producción
    needs: staging
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Verificar configuración del entorno
        id: cfg
        run: |
          if [ -z "$SUPABASE_PROJECT_REF" ] || [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::notice::El environment 'production' aún no está configurado (ver docs/runbook-entornos.md). Se omite el despliegue."
            echo "listo=false" >> "$GITHUB_OUTPUT"
          else
            echo "listo=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.cfg.outputs.listo == 'true'
        uses: pnpm/action-setup@v6
      - if: steps.cfg.outputs.listo == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
      - if: steps.cfg.outputs.listo == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.cfg.outputs.listo == 'true'
        name: Migraciones
        run: |
          pnpm exec supabase link --project-ref "$SUPABASE_PROJECT_REF"
          pnpm exec supabase db push
      - if: steps.cfg.outputs.listo == 'true'
        name: Edge Functions
        run: pnpm exec supabase functions deploy --project-ref "$SUPABASE_PROJECT_REF"
